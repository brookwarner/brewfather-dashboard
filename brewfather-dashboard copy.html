<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brewfather Dashboard 🍺</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 20px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.5em;
            padding: 40px;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ff4444;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .info-bar {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .batches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .batch-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .batch-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .batch-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        .batch-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .batch-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .batch-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .batch-no {
            color: #666;
            font-size: 0.9em;
        }

        .status-badge {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .recipe-info {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .recipe-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .recipe-style {
            color: #666;
            font-size: 0.9em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .stat {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
        }

        .stat-label {
            font-size: 0.8em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }

        .temp-display {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 8px;
        }

        .temp-value {
            font-size: 2em;
            font-weight: bold;
        }

        .brew-date {
            color: #888;
            font-size: 0.9em;
            margin-top: 10px;
            text-align: center;
        }

        .no-data {
            text-align: center;
            color: white;
            font-size: 1.3em;
            padding: 60px 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .refresh-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
        }

        .refresh-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            
            .batches-grid {
                grid-template-columns: 1fr;
            }
            
            .info-bar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍺 Brewfather Dashboard</h1>
            <p class="subtitle">Currently Fermenting Batches</p>
        </header>

        <div id="app">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading brewing data...</p>
            </div>
        </div>
    </div>

    <script>
        const API_ENDPOINT = '/api/brewfather';
        
        async function fetchBrewfatherData() {
            try {
                const response = await fetch(API_ENDPOINT);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching data:', error);
                throw error;
            }
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });
        }

        function formatTemp(temp) {
            if (temp === undefined || temp === null) return 'N/A';
            return `${temp.toFixed(1)}°C`;
        }

        function formatGravity(gravity) {
            if (gravity === undefined || gravity === null) return 'N/A';
            return gravity.toFixed(3);
        }

        function renderBatch(batch) {
            return `
                <div class="batch-card">
                    <div class="batch-header">
                        <div class="batch-name">${batch.name || 'Unnamed Batch'}</div>
                        <div class="batch-meta">
                            <span class="batch-no">Batch #${batch.batchNo || 'N/A'}</span>
                            <span class="status-badge">${batch.status || 'Unknown'}</span>
                        </div>
                    </div>

                    ${batch.recipe ? `
                        <div class="recipe-info">
                            <div class="recipe-name">📋 ${batch.recipe.name}</div>
                            ${batch.recipe.style ? `<div class="recipe-style">${batch.recipe.style}</div>` : ''}
                        </div>
                    ` : ''}

                    <div class="stats-grid">
                        ${batch.temp !== undefined && batch.temp !== null ? `
                            <div class="temp-display">
                                <div class="stat-label">Current Temperature</div>
                                <div class="temp-value">${formatTemp(batch.temp)}</div>
                            </div>
                        ` : ''}
                        
                        <div class="stat">
                            <div class="stat-label">Est. OG</div>
                            <div class="stat-value">${formatGravity(batch.estimatedOg)}</div>
                        </div>
                        
                        <div class="stat">
                            <div class="stat-label">Est. FG</div>
                            <div class="stat-value">${formatGravity(batch.estimatedFg)}</div>
                        </div>
                        
                        <div class="stat">
                            <div class="stat-label">Measured OG</div>
                            <div class="stat-value">${formatGravity(batch.measuredOg)}</div>
                        </div>
                        
                        <div class="stat">
                            <div class="stat-label">Measured FG</div>
                            <div class="stat-value">${formatGravity(batch.measuredFg)}</div>
                        </div>
                    </div>

                    ${batch.brewDate ? `
                        <div class="brew-date">
                            🗓️ Brewed: ${formatDate(batch.brewDate)}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderApp(data) {
            const app = document.getElementById('app');
            
            if (data.error) {
                app.innerHTML = `
                    <div class="error">
                        <h2>❌ Error Loading Data</h2>
                        <p>${data.message || 'Failed to fetch brewing data'}</p>
                        <button class="refresh-btn" onclick="loadData()" style="margin-top: 15px;">
                            Try Again
                        </button>
                    </div>
                `;
                return;
            }

            const { batches, count, cached, cache_age_minutes, fetchedAt } = data;

            let infoBar = `
                <div class="info-bar">
                    <div class="info-item">
                        <span>📊 <strong>${count || 0}</strong> batches fermenting</span>
                    </div>
                    ${cached ? `
                        <div class="info-item">
                            <span>💾 Cached (${cache_age_minutes}m ago)</span>
                        </div>
                    ` : ''}
                    ${fetchedAt ? `
                        <div class="info-item">
                            <span>🕐 ${formatDate(fetchedAt)}</span>
                        </div>
                    ` : ''}
                    <button class="refresh-btn" onclick="loadData()">
                        🔄 Refresh
                    </button>
                </div>
            `;

            if (!batches || batches.length === 0) {
                app.innerHTML = infoBar + `
                    <div class="no-data">
                        <p>🍺 No batches currently fermenting</p>
                        <p style="font-size: 0.9em; margin-top: 10px; opacity: 0.8;">
                            Time to start a new brew!
                        </p>
                    </div>
                `;
                return;
            }

            const batchesHTML = batches.map(batch => renderBatch(batch)).join('');
            
            app.innerHTML = infoBar + `
                <div class="batches-grid">
                    ${batchesHTML}
                </div>
            `;
        }

        async function loadData() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading brewing data...</p>
                </div>
            `;

            try {
                const data = await fetchBrewfatherData();
                renderApp(data);
            } catch (error) {
                renderApp({
                    error: true,
                    message: error.message
                });
            }
        }

        // Load data on page load
        loadData();
    </script>
</body>
</html>
